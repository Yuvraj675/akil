# Cluster for the AKIL end-to-end experiment (deploy/experiment/run.sh).
# Kubernetes 1.31 to match the k8s.io/kubernetes version the plugin links against.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: akil-exp
nodes:
  - role: control-plane
    image: kindest/node:v1.31.12
  - role: worker
    image: kindest/node:v1.31.12
  - role: worker
    image: kindest/node:v1.31.12
  - role: worker
    image: kindest/node:v1.31.12
