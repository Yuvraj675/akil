apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-workload
  labels:
    akil.io/autoscale: "true"
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-workload
  template:
    metadata:
      labels:
        app: demo-workload
    spec:
      containers:
      - name: workload
        image: alpine
        command: ["/bin/sh", "-c"]
        # Idle on purpose: the autoscaler decides on the demo's telemetry, and its own
        # kernel noise would otherwise keep it scaled up.
        args: ["while true; do sleep 3600; done"]
        resources:
          requests:
            cpu: 100m
            memory: 32Mi
          limits:
            memory: 64Mi
