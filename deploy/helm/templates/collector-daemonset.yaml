{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: akil-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: akil-collector
    app.kubernetes.io/component: collector
    app.kubernetes.io/part-of: akil
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: akil-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akil-collector
        app.kubernetes.io/component: collector
        app.kubernetes.io/part-of: akil
    spec:
      hostPID: {{ .Values.collector.hostPID }}
      serviceAccountName: akil-collector
      containers:
        - name: collector
          image: "{{ .Values.image.registry }}/collector:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --aggregator-addr=akil-aggregator.{{ .Values.namespace }}:{{ .Values.aggregator.port }}
            - --ring-buffer-size={{ .Values.collector.ringBufferSize }}
            - --batch-max-events={{ .Values.collector.batchMaxEvents }}
            - --batch-interval={{ .Values.collector.batchIntervalMs }}ms
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.collector.securityContext | nindent 12 }}
          volumeMounts:
            - name: sys-fs-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: sys-kernel-btf
              mountPath: /sys/kernel/btf
              readOnly: true
      volumes:
        - name: sys-fs-cgroup
          hostPath:
            path: /sys/fs/cgroup
        - name: sys-kernel-btf
          hostPath:
            path: /sys/kernel/btf
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
{{- end }}
