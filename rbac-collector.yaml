---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: akil-collector-sa
  namespace: akil-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: akil-collector-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: akil-collector-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: akil-collector-role
subjects:
- kind: ServiceAccount
  name: akil-collector-sa
  namespace: akil-system
